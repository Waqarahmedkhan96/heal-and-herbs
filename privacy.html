<section class="wrap" style="padding-top: 24px; padding-bottom: 56px"><div class="legal"><p class="eyebrow">Policies</p><h1 class="h1" style="margin-top: 10px; font-size: clamp(34px, 6vw, 52px)">Privacy policy</h1><p class="muted" style="margin: 10px 0 0">Last updated: 19 November 2026</p><p class="lead" style="margin-top: 18px">How Heal &amp; Herbs collects, uses and protects your information when you book a consultation, place an order or contact us.</p><h2>Who we are</h2><p>Heal &amp; Herbs is the practice of Haroon Ur Rasheed, FTJ, Office 4, Al-Rehman Plaza, Blue Area, Islamabad, Pakistan. We are responsible for the information you share with us.</p><h2>What we collect</h2><ul><li>Booking details: name, phone or WhatsApp number, email, the topic of your consultation and any notes you choose to add.</li><li>Order details: name, phone, email, delivery address and the items you buy.</li><li>Messages you send through the contact form, WhatsApp or email.</li><li>Your basket is stored only in your own browser so it is there when you return.</li></ul><h2>Health information</h2><p>Consultation notes can include health information. We use it only to provide your consultation, keep it confidential, and never sell it or use it for advertising.</p><h2>How we use it</h2><ul><li>To arrange and hold your consultation and send meeting links.</li><li>To process, deliver and support your orders.</li><li>To reply to your messages.</li><li>To send clinic notes by email, only if you sign up; you can unsubscribe at any time.</li></ul><h2>Who we share it with</h2><p>Only the services needed to run the practice: our website host, email provider, payment providers, video-call providers (Google Meet, Zoom or WhatsApp) and couriers. Each receives only what it needs.</p><h2>How long we keep it</h2><p>Consultation records are kept for 5 years in line with professional requirements. Order records are kept for 6 years for accounting. You can ask us to delete information we no longer need to keep.</p><h2>Your choices</h2><p>You can ask for a copy of your information, correct it or ask us to delete it by contacting us. We do not use advertising cookies or tracking pixels on this site.</p><div class="card card-sage" style="margin-top: 32px"><strong style="color: #193E33">Questions?</strong> Contact us on WhatsApp +92 300 0000000 or hello@healandherbs.pk.</div></div></section>
</main>
